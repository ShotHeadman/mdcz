name: Promote published image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-image
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the released multi-platform manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          LATEST_TAG=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [ "$RELEASE_TAG" != "$LATEST_TAG" ]; then
            echo "Leaving latest unchanged: this is not the repository's latest release."
            exit 0
          fi
          docker buildx imagetools create --tag ghcr.io/shotheadman/mdcz:latest "ghcr.io/shotheadman/mdcz:$VERSION"
