name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "scripts/**"
      - "mise.toml"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "tsconfig.web.json"
      - "tsconfig.desktop-renderer.json"
      - "tsconfig.test.json"
      - "docker/**"
      - ".dockerignore"
      - "compose.yaml"

permissions:
  contents: write
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml

  version:
    needs: checks
    # Serialized and run against the latest main, so back-to-back merges bump on top of
    # each other's release commit instead of racing to push the same tag. Only the commit
    # that passed `checks` may be released; a run whose commit is no longer the tip skips,
    # because the newer push's run checks and releases a superset of it.
    concurrency: release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      skipped: ${{ steps.check.outputs.skipped }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      # The release number is declared by the merged branch name (feat/X.Y.Z or fix/X.Y.Z),
      # so commit prefixes inside a branch cannot change it. A merge that declares none
      # (dependabot, squash merge) does not release; its changes ship with the next declared one.
      - name: Check if version bump needed
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          DECLARED=$(git log "${LAST_TAG:+${LAST_TAG}..}HEAD" --merges --pretty=%s \
            | sed -nE 's#^Merge pull request \#[0-9]+ from [^/]+/(feat|fix)/([0-9]+\.[0-9]+\.[0-9]+)$#\2#p' \
            | sort -V | tail -n 1)
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved past checked commit $GITHUB_SHA; its newer run releases it"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(git log -1 --pretty=%s)" == chore\(release\):* ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$DECLARED" ]; then
            echo "::notice::no feat/X.Y.Z or fix/X.Y.Z merge since ${LAST_TAG:-the start}; not releasing"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "declared=$DECLARED" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.check.outputs.skipped == 'false'
        id: bump
        run: |
          NEW_VERSION=$(node scripts/bump-version.mjs ${{ steps.check.outputs.declared }})
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        if: steps.check.outputs.skipped == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json apps/desktop/package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin main --tags

  build:
    needs: version
    if: needs.version.outputs.skipped == 'false'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            artifact: desktop-linux
            glob: |
              release/*/*.AppImage
              release/*/latest-linux.yml
          - os: windows-latest
            script: build:win
            artifact: desktop-windows
            glob: |
              release/*/*-setup.exe
              release/*/*-setup.exe.blockmap
              release/*/*-portable.zip
              release/*/latest.yml
          - os: macos-latest
            script: build:mac
            artifact: desktop-macos
            glob: "release/*/*.dmg"
          - os: ubuntu-latest
            script: package:webui
            artifact: webui-portable
            glob: "release/mdcz-*.tar.gz"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MDCZ_RELEASE_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: version
    if: needs.version.outputs.skipped == 'false'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MDCZ_RELEASE_VERSION=${{ needs.version.outputs.version }}
            MDCZ_REVISION=${{ steps.source.outputs.revision }}
          tags: |
            ghcr.io/shotheadman/mdcz:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, build, docker]
    if: needs.version.outputs.skipped == 'false'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: MDCz ${{ needs.version.outputs.tag }}
          draft: true
          overwrite_files: true
          files: dist/**/*
