services:
  mdcz:
    image: ghcr.io/shotheadman/mdcz:${MDCZ_VERSION:?Set MDCZ_VERSION in .env to a published release version (e.g. 0.15.0)}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${MDCZ_BIND_IP:-127.0.0.1}:3838:3838"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
      MDCZ_ADMIN_PASSWORD: ${MDCZ_ADMIN_PASSWORD:-}
    volumes:
      - type: bind
        source: ${MDCZ_STATE_PATH:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${MDCZ_MEDIA_PATH:?Set MDCZ_MEDIA_PATH in .env to an existing media directory}
        target: /media
        bind:
          create_host_path: false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
